name: Build & Push Image

# 手动触发：Actions 页面 → Build & Push Image → Run workflow
# rootfs/ 已直接入库，checkout 后即可构建，无需任何额外素材
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空用 latest）'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算镜像名（ghcr 要求全小写）
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.game
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: echo "镜像已推送 → ${{ env.IMAGE }}:${{ inputs.tag }}"
